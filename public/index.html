<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Koyeb Web Proxy</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div class="logo">
🌐
</div>


<h1>
Koyeb Web Proxy
</h1>


<p>
Browse websites through our secure proxy server
</p>



<form action="/web">


<input
id="url"
name="url"
placeholder="Enter website URL"
autocomplete="off"
>


<button>
Open Website
</button>


</form>



<div class="features">


<div>
⚡ Fast browsing
</div>


<div>
🔒 Server IP protection
</div>


<div>
🍪 Cookie support
</div>


<div>
🎬 Media streaming
</div>


</div>



</div>



<script>

document.querySelector("form")
.addEventListener("submit",function(e){


let input =
document.getElementById("url");


let url =
input.value.trim();



if(url===""){
    e.preventDefault();
    alert("Enter website URL");
}


if(
!url.startsWith("http")
){
    input.value =
    "https://" + url;
}



});


</script>



</body>

</html>
